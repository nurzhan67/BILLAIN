<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTL Lost & Found</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        h1 { color: #4f46e5; text-align: center; }
        #loader { text-align: center; font-size: 18px; margin-top: 40px; color: #666; }
        table { border-collapse: collapse; width: 100%; background: #fff; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4f46e5; color: white; }
        tr:nth-child(even) { background-color: #f9fafb; }
    </style>
</head>
<body>

    <h1>KTL Lost & Found — Вещи из таблицы</h1>
    <div id="loader">Загрузка данных из таблицы...</div>
    
    <table id="data-table" style="display: none;">
        <thead>
            <tr id="table-headers"></tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        // Ваша ссылка на Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz73wF8J45m2hQrAnYBScoC8mA9heaTniNDYDhddyvUn53eYmhAzBBdDY9OTssC0eJs/exec';

        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if (data.length === 0) {
                    document.getElementById('loader').style.display = 'block';
                    document.getElementById('loader').textContent = 'Таблица пуста.';
                    return;
                }

                let table = document.getElementById('data-table');
                table.style.display = 'table';

                // Создаем заголовки
                let headersRow = document.getElementById('table-headers');
                let keys = Object.keys(data[0]);
                keys.forEach(key => {
                    let th = document.createElement('th');
                    th.textContent = key;
                    headersRow.appendChild(th);
                });

                // Заполняем строки
                let tbody = document.getElementById('table-body');
                data.forEach(item => {
                    let tr = document.createElement('tr');
                    keys.forEach(key => {
                        let td = document.createElement('td');
                        td.textContent = item[key];
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                document.getElementById('loader').textContent = 'Ошибка загрузки данных. Проверьте консоль.';
                console.error('Ошибка:', error);
            });
    </script>

</body>
</html>
